<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exilewright</title>
<style>
  :root { --bg:#111; --panel:#1b1b1b; --line:#333; --txt:#ddd; --acc:#c8a050; }
  /* scroll bars in the app's colours: a dark track and a bronze grip, gold under the pointer */
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-corner { background:#0e0d0b; }
  ::-webkit-scrollbar-track { background:#0e0d0b; border-left:1px solid #2a2620; }
  ::-webkit-scrollbar-thumb { background:#4a3f2c; border:2px solid #0e0d0b; border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover { background:#7a6440; } ::-webkit-scrollbar-thumb:active { background:var(--acc); }
  ::-webkit-scrollbar-button { display:none; }
  * { box-sizing: border-box; }
  body { margin:0; display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--txt); font:13px system-ui, sans-serif; }
  #top { display:flex; align-items:center; gap:8px; padding:6px 10px; background:linear-gradient(#24201a, #17140f); border-bottom:1px solid #4a3f2c; position:relative; flex-wrap:wrap; }
  #top label { display:flex; align-items:center; gap:5px; margin:0; color:#a89878; font-family:Georgia, serif; }
  #top input, #top select { width:auto; } #top #name { width:170px; } #top #level { width:56px; } #top #buildList { max-width:180px; }
  #top .grow { flex:1; }
  #top button { background:#2c261d; border-color:#5a4a30; color:#e0cfa8; cursor:pointer; }
  #top button:disabled { opacity:.4; cursor:default; } #undo, #redo { font-size:15px; line-height:1; padding:2px 8px; }
  #updNote { color:#f0cc66; margin-left:10px; } #updNote button { margin-left:6px; }
  #top button:hover { background:#3a3225; }
  #notesBox { position:absolute; right:10px; top:100%; z-index:5; width:360px; padding:8px; background:#16130f; border:1px solid #5a4a30; box-shadow:0 6px 20px #000; }
  #notesBox[hidden] { display:none; }
  #body { flex:1; display:flex; min-height:0; }
  aside { width:350px; display:flex; flex-direction:column; background:#0e0c0a; border-right:1px solid #3a3022; flex:none; }
  aside[hidden] { display:none; }
  #charPanel { flex:1; overflow:auto; min-height:0; }
  #sceneSkills { flex:1.6; display:flex; flex-direction:column; overflow:hidden; min-height:0; padding:8px 10px; border-top:2px solid #4a3f2c; background:#121010; }
  #sceneSkills[hidden] { display:none; }
  /* the skills' title stays, the cards scroll under it */
  #sceneList { flex:1; min-height:0; display:flex; flex-direction:column; }
  #sceneList .sk-scroll { flex:1; min-height:0; overflow:auto; }
  #sceneSkills h3, #simChar h3 { margin:14px 0 6px; font:14px Georgia, serif; font-variant:small-caps; color:#e8d8a8; display:flex; align-items:baseline; gap:6px; border-bottom:1px solid #3a3022; padding-bottom:3px; }
  #sceneSkills h3:first-child, #simChar h3:first-child { margin-top:0; }
  /* the 3D scene's side panel: only what buffs and ailments change while you play */
  #simChar { flex:1; overflow:auto; min-height:0; padding:8px 10px; }
  #simChar[hidden] { display:none; }
  #simChar .up, .sdps.up { color:#7fd07f; } #simChar .down, .sdps.down { color:#f07060; }
  /* the enemy panel: a dropdown in the scene, by the help button */
  .s-enwrap { position:absolute; top:10px; right:46px; z-index:3; max-width:calc(100% - 56px); font-family:Georgia, serif; }
  .s-enwrap summary { list-style:none; height:28px; padding:0 12px; font:14px/26px Georgia, serif; font-variant:small-caps; color:#e8d8a8; background:#0b0a08d9; border:1px solid #5a4a30; cursor:pointer; text-align:right; }
  .s-enwrap summary::-webkit-details-marker { display:none; }
  .s-enwrap summary::after { content:' ▾'; } .s-enwrap[open] summary::after { content:' ▴'; }
  .s-enwrap summary:hover, .s-enwrap[open] summary { border-color:#c9a85a; color:#ffe9b0; }
  #sceneEnemy { width:340px; max-width:100%; box-sizing:border-box; max-height:calc(100vh - 330px); overflow:auto; margin-top:4px; padding:8px 10px; background:#0e0c0af2; border:1px solid #5a4a30; }
  #sceneEnemy p.en-areas { margin:1px 0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* enemy picker of the 3D scene */
  .en-pick input { width:100%; box-sizing:border-box; padding:4px 6px; background:#14110d; border:1px solid #5a4a30; color:#e8d8a8; font:13px Georgia, serif; }
  .en-pick input:focus { outline:none; border-color:#c9a85a; }
  #enList { max-height:290px; overflow:auto; background:#0e0c09; border:1px solid #5a4a30; border-top:0; }
  .en-row { display:flex; flex-direction:column; padding:3px 7px; border-bottom:1px solid #1e1a14; cursor:pointer; font-size:12.5px; color:#d8c8a0; }
  .en-row small { font-size:11px; color:#8a7a5c; } .en-row span small { color:#a89878; } .en-row small b { font-weight:normal; color:#e0a060; }
  .en-row:hover, .en-row.at { background:#2a2318; } .en-row.on { box-shadow:inset 3px 0 #c9a85a; }
  #enList p.note { margin:0; padding:5px 7px; }
  .en-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; margin-top:8px; font:14px Georgia, serif; color:#e8d8a8; }
  .en-head small { font-size:11px; color:#a89878; } .en-head span { margin-left:auto; font-size:11.5px; color:#c9a85a; }
  #enDetail .sk-set { margin:6px 0; } #enDetail .sk-set a { color:#c9a85a; cursor:pointer; } #enDetail .sk-set small { color:#6f6450; }
  #enDetail h4 { margin:10px 0 3px; font:12.5px Georgia, serif; color:#c9a85a; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; }
  #enDetail h4 small { margin-left:auto; font-size:10.5px; color:#6f6450; }
  .en-t { width:100%; border-collapse:collapse; font-size:12px; }
  .en-t th { padding:1.5px 0; text-align:left; font-weight:normal; color:#8a7a5c; } .en-t td { padding:1.5px 0; text-align:right; color:#c8b890; } .en-t td b { font-weight:normal; color:#f0e8d0; }
  .en-t tr + tr { border-top:1px solid #1e1a14; }
  .dm.fire { color:#f0906a; } .dm.cold { color:#7cc4f0; } .dm.lightning { color:#f0e070; } .dm.chaos { color:#d48ae2; } .dm.physical { color:#d8c8b0; } .dm.es { color:#7cb8f0; }
  .en-btns { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .en-btns button { flex:1 1 auto; padding:4px 6px; font-size:12px; background:#2c261d; border:1px solid #5a4a30; color:#e0cfa8; cursor:pointer; } .en-btns button:hover { background:#3a3225; }
  .en-btns button.on { flex-basis:100%; background:#4a3a14; border-color:#c9a85a; color:#ffe9a8; }
  #sceneSkills h3 .note, #simChar h3 .note { font-variant:normal; margin-left:auto; }
  /* 3D scene side panel: one card per skill, the build's combos and the training-ground settings */
  .sk-card { --c:#8a7a5c; margin:0 0 6px; padding:6px 7px 6px 9px; background:linear-gradient(#1c1813, #13100c); border:1px solid #3a3022; border-left:3px solid var(--c); cursor:pointer; }
  .sk-card:hover { border-color:#6a5a3a; border-left-color:var(--c); }
  .sk-card.on { border-color:#c9a85a; border-left-color:var(--c); background:linear-gradient(#262015, #17130d); box-shadow:0 0 0 1px #c9a85a44; }
  .el-fire { --c:#ff7a3a; } .el-cold { --c:#8ac8ff; } .el-lightning { --c:#ffe25a; } .el-chaos { --c:#c070d0; } .el-physical { --c:#c8b8a0; } .el-arcane { --c:#6f9cff; }
  .sk-head { display:flex; align-items:center; gap:8px; }
  .sk-ico { position:relative; width:34px; height:34px; flex:none; border:1px solid #5a4a30; background:#000; }
  .sk-ico img { width:100%; height:100%; display:block; object-fit:cover; }
  .sk-ico i { position:absolute; left:-5px; top:-5px; min-width:15px; height:15px; padding:0 3px; font:bold 10px/14px system-ui, sans-serif; text-align:center; color:#17130d; background:#c9a85a; border-radius:8px; }
  .sk-name { flex:1; min-width:0; display:flex; flex-direction:column; font:14px Georgia, serif; color:#e8d8a8; }
  .sk-name > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:help; }
  .sk-name small { font:11px system-ui, sans-serif; color:#8a7a5c; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
  .chip { padding:1px 6px; font-size:10.5px; line-height:1.5; color:#b8a888; background:#211c15; border:1px solid #3a3022; border-radius:9px; white-space:nowrap; }
  .chip.k { color:#17130d; background:#c9a85a; border-color:#c9a85a; font-weight:600; }
  .chip.fire { color:#ff9a62; border-color:#7a3a1c; } .chip.cold { color:#9ad2ff; border-color:#33566f; } .chip.lightning { color:#ffe66e; border-color:#6f6222; }
  .chip.chaos { color:#d48ae2; border-color:#5d3168; } .chip.physical { color:#d8c8b0; border-color:#5a5044; }
  .chip.a { color:#a8b890; border-color:#3f4a30; } .chip.g { color:#8fc0a0; border-color:#2f5540; } .chip.p { color:#ffd27a; border-color:#7a5a1c; background:#2a2010; }
  .chip.w { color:#f09a8a; border-color:#6f3329; } .chip.c { color:#a8b8f0; border-color:#3a4478; }
  .sk-facts { display:flex; flex-wrap:wrap; gap:2px 12px; margin-top:5px; font-size:11.5px; color:#8a7a5c; }
  .sk-facts b { font-weight:normal; color:#e8e0cc; }
  /* the skills a meta gem uses, inside its card */
  .sk-sub { margin:6px 0 0 4px; padding-left:8px; border-left:2px solid #6a5a3a; }
  .sk-sub .sk-card { margin:4px 0 0; }
  .sk-set { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; font-size:12px; }
  .sk-set label { display:flex; flex-direction:column; align-items:stretch; gap:2px; margin:0; color:#8a7a5c; }
  .sk-set input, .sk-set select { padding:2px 4px; background:#14110d; border-color:#3a3022; }
  .sk-set button { align-self:end; padding:3px 6px; background:#2c261d; border-color:#5a4a30; color:#e0cfa8; cursor:pointer; } .sk-set button:hover { background:#3a3225; }
  #sceneSkills p.note, #sceneEnemy p.note { margin:8px 0 0; font-size:11px; line-height:1.4; }
  /* 3D scene overlays */
  #scene { overflow:hidden; background:#07080b; user-select:none; container-type:inline-size; }
  #scene canvas { position:absolute; inset:0; cursor:crosshair; }
  /* the simulator's screen, laid out like the game's: effects top left, orbs in the bottom corners, skills by the mana orb */
  .s-top, .s-log, .s-life, .s-mana, .s-bar, .s-tip, .s-toast { position:absolute; pointer-events:none; font-family:Georgia, serif; }
  .s-top { left:10px; right:10px; top:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  /* buffs as the game's: icons in a row, the count in the corner, the seconds left under it */
  .s-col { display:flex; flex-direction:column; gap:18px; max-width:calc(100% - 180px); }
  .s-buffs { display:flex; flex-wrap:wrap; gap:16px 4px; pointer-events:auto; }
  .s-buff { position:relative; width:34px; height:34px; background:#000; border:1px solid #6a5a3a; box-shadow:0 0 0 1px #000, 0 2px 6px #000a; }
  .s-buff img { width:100%; height:100%; display:block; }
  .s-buff.fill img { position:absolute; inset:0; } .s-buff.fill img:first-child { filter:grayscale(1) brightness(.7); }   /* a buildup: the grey icon fills up in colour */
  .s-buff.bad { border-color:#c0392b; box-shadow:0 0 0 1px #000, 0 0 6px #c0392b99; }   /* the ailments on you, framed in red as the game's debuffs */
  .s-buff i { display:flex; width:100%; height:100%; align-items:center; justify-content:center; font:12px Georgia, serif; font-style:normal; color:var(--c, #c8b890); }
  .s-buff em { position:absolute; right:2px; bottom:0; font:bold 12px system-ui, sans-serif; font-style:normal; color:#fff; text-shadow:0 0 2px #000, 0 0 3px #000, 0 0 3px #000; }
  .s-buff small { position:absolute; left:-6px; right:-6px; top:100%; margin-top:1px; text-align:center; font:11px system-ui, sans-serif; color:#e8dcc0; text-shadow:0 1px 2px #000, 0 0 2px #000; }
  .s-buffs .s-txt { align-self:center; padding:3px 8px; font-size:12px; color:var(--c, #e8d8a8); background:#0b0a08d9; border:1px solid var(--c, #5a4a30); white-space:nowrap; }
  .s-help { pointer-events:auto; flex:none; width:28px; height:28px; margin-left:auto; padding:0; font:bold 15px Georgia, serif; color:#c8b890; background:#0b0a08d9; border:1px solid #5a4a30; border-radius:50%; cursor:pointer; }
  .s-help:hover, .s-help.on { color:#ffe9b0; border-color:#c9a85a; }
  #scene #hud { position:absolute; top:44px; right:10px; z-index:2; max-width:calc(100% - 20px); padding:7px 10px; font:11.5px/1.55 system-ui, sans-serif; white-space:pre-wrap; color:#a89878; background:#0b0a08eb; border:1px solid #5a4a30; }
  #scene #hud[hidden] { display:none; }
  .s-log { left:14px; bottom:186px; width:min(400px, calc(100% - 28px)); display:flex; flex-direction:column; gap:2px; }
  .s-log div { padding:2px 8px; font-size:12.5px; color:#e8e0cc; background:linear-gradient(90deg, #0b0a08d9, #0b0a0800); border-left:2px solid var(--c, #c9a85a); transition:opacity .8s; }
  .s-log div.old { opacity:.35; }
  .s-life, .s-mana { bottom:10px; display:flex; flex-direction:column; gap:6px; }
  .s-life { left:12px; align-items:flex-start; }
  .s-mana { right:12px; align-items:flex-end; }
  .s-vtxt { display:grid; grid-template-columns:auto auto; column-gap:12px; font-size:15px; line-height:1.25; color:#c8b890; text-shadow:0 1px 3px #000, 0 0 2px #000; }
  .s-vtxt div { display:contents; }
  .s-vtxt b { font-weight:normal; color:#f4ecd8; text-align:right; white-space:nowrap; }
  .s-life .s-vtxt { margin-left:24px; }
  .s-mana .s-vtxt { margin-right:24px; }
  .s-orb { position:relative; width:118px; height:118px; border-radius:50%; overflow:hidden; background:radial-gradient(circle at 50% 60%, #15110c, #050403); border:3px solid #5a4a30; box-shadow:0 0 0 2px #1a140c, 0 4px 14px #000c, inset 0 0 18px #000; }
  .s-orb i { position:absolute; left:0; right:0; bottom:0; transition:height .15s linear; }
  .s-life .s-orb i { background:radial-gradient(circle at 40% 30%, #e0483a, #8e1610 55%, #3e0806); }
  .s-mana .s-orb i { background:radial-gradient(circle at 40% 30%, #4f8be8, #1a3f9a 55%, #08164a); }
  .s-orb::after { content:''; position:absolute; inset:8% 22% 52% 18%; border-radius:50%; background:radial-gradient(ellipse at 50% 30%, #ffffff40, #ffffff00 70%); }
  /* energy shield: a ring around the life orb, filled as far as it is */
  .s-orb u { position:absolute; inset:0; border-radius:50%; background:conic-gradient(#7cc0ff var(--p), #7cc0ff26 0); -webkit-mask:radial-gradient(closest-side, #0000 calc(100% - 7px), #000 calc(100% - 6px)); mask:radial-gradient(closest-side, #0000 calc(100% - 7px), #000 calc(100% - 6px)); }
  /* the skill bar in the middle, between the orbs: mouse buttons, then Q W E R T */
  .s-bar { left:50%; transform:translateX(-50%); bottom:12px; width:max-content; max-width:calc(100% - 300px); box-sizing:border-box; display:flex; justify-content:center; gap:5px; padding:6px; background:linear-gradient(#1a150e, #0b0a08); border:1px solid #5a4a30; box-shadow:0 0 0 1px #000, 0 4px 12px #000a; pointer-events:auto; }
  .s-bar:empty, .s-buffs:empty { display:none; }
  .s-bar .note { padding:4px 8px; font-size:12px; color:#a89878; }
  .s-slot { position:relative; flex:0 1 58px; width:58px; min-width:26px; aspect-ratio:1; padding:0; background:#000; border:1px solid #4a3f2c; cursor:pointer; overflow:hidden; }
  /* the flasks together before the skills, apart from them, as the game's belt: the item's art, darkened above the charges it has */
  .s-belt { display:flex; gap:4px; margin-right:14px; padding-right:14px; border-right:1px solid #3a3020; }
  .s-flask { position:relative; flex:0 0 32px; width:32px; height:58px; align-self:center; padding:0; background:#000; border:1px solid #4a3f2c; cursor:pointer; overflow:hidden; }
  .s-flask img { width:100%; height:100%; object-fit:contain; display:block; }
  .s-flask i { position:absolute; left:0; right:0; top:0; background:#000b; }
  .s-flask b { position:absolute; left:0; right:0; bottom:0; font:bold 11px/15px system-ui, sans-serif; text-align:center; color:#e8dcc0; background:#000b; }
  .s-charm { flex-basis:30px; width:30px; height:30px; cursor:default; }
  .en-still { display:block; margin:6px 0 0; font-size:13px; cursor:pointer; }
  .s-flask.act { border-color:#c9a85a; box-shadow:0 0 6px #c9a85a; }
  .s-flask.low img { filter:grayscale(.8) brightness(.6); }
  .s-slot.none, .s-flask.none { background:radial-gradient(circle, #1a150e, #070605); border-style:dashed; }
  .s-mouse { width:10px; height:14px; vertical-align:-3px; }
  .s-slot img { width:100%; height:100%; display:block; object-fit:cover; }
  .s-slot span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:12px Georgia, serif; color:var(--c, #c8b890); }
  .s-slot img + span { display:none; }
  .s-slot b { position:absolute; left:0; right:0; bottom:0; font:bold 11px/15px system-ui, sans-serif; text-align:center; color:#e8dcc0; background:#000b; }
  .s-slot:hover { border-color:#8a7a5c; }
  .s-slot.on { border-color:var(--c, #c9a85a); box-shadow:0 0 8px var(--c, #c9a85a); }
  .s-slot.act::after { content:''; position:absolute; inset:0; border:2px solid var(--c, #c9a85a); box-shadow:inset 0 0 12px var(--c, #c9a85a); }
  .s-tip { z-index:3; width:max-content; max-width:260px; padding:7px 10px 8px; color:#a89878; background:#0b0a08f0; border:1px solid #5a4a30; border-top:2px solid var(--c, #c9a85a); }
  .s-tip[hidden], .s-pick[hidden] { display:none; }
  /* the skills to put on a slot, as the game's list over its bar */
  .s-pick { position:absolute; z-index:4; display:grid; grid-template-columns:repeat(auto-fill, 46px); gap:4px; width:max-content; max-width:min(260px, calc(100% - 12px)); padding:6px; background:#0b0a08f2; border:1px solid #5a4a30; box-shadow:0 4px 14px #000c; }
  .s-pick button { width:46px; height:46px; padding:0; background:#000; border:1px solid #4a3f2c; color:#c8b890; font:13px Georgia, serif; cursor:pointer; overflow:hidden; }
  .s-pick button:hover, .s-pick button.on { border-color:#c9a85a; box-shadow:0 0 6px #c9a85a; }
  .s-pick img { width:100%; height:100%; display:block; }
  .s-tip b { display:block; font-weight:normal; font-size:16px; margin-bottom:2px; }
  .s-tip span { display:block; font-size:12px; line-height:1.45; }
  .s-tip span:first-of-type { color:#c8b890; font-variant:small-caps; font-size:13px; }
  .s-tip small { display:block; margin-top:3px; font-size:11.5px; color:#ffd27a; }
  /* a scene too narrow for the bar between the orbs: the bar along the bottom, the orbs over it */
  @container (max-width:860px) { .s-orb { width:84px; height:84px; } .s-bar { bottom:8px; max-width:calc(100% - 16px); }
    .s-belt { margin-right:6px; padding-right:6px; } .s-flask { flex-basis:24px; width:24px; height:46px; } .s-charm { flex-basis:22px; width:22px; height:22px; } .s-life, .s-mana { bottom:82px; } .s-vtxt { font-size:13px; } .s-log { bottom:226px; } }
  .s-toast { left:50%; top:16%; transform:translateX(-50%); padding:5px 14px; font-size:15px; color:#ffe9b0; background:#0b0a08e6; border:1px solid #7a6440; opacity:0; transition:opacity .25s; width:max-content; max-width:calc(100% - 40px); text-align:center; }
  .s-toast.on { opacity:1; }
  /* character panel, like the in-game one */
  .cp { font-family:Georgia, serif; padding:8px 14px 14px 8px; color:#c8b890; font-variant:small-caps; }
  .cp-name { display:block; width:calc(100% - 80px); box-sizing:border-box; text-align:center; color:#e8d8a8; font:16px Georgia, serif; font-variant:small-caps; padding:4px; margin:0 40px 8px; border:1px solid #5a4a30; background:linear-gradient(#2a2218, #15110c); }
  .cp-name:hover, .cp-name:focus { border-color:#a08850; outline:none; }
  .cp-id .cp-pick { display:flex; justify-content:space-between; align-items:center; width:100%; box-sizing:border-box; text-align:left; margin:2px 0; padding:3px 6px;
    font:12px Georgia, serif; font-variant:small-caps; color:#c8b890; background:#14110d; border:1px solid #2e271c; cursor:pointer; }
  .cp-id .cp-pick::after { content:'⌄'; color:#8a7a5c; line-height:0.6; }
  .cp-id .cp-pick.open::after { content:'⌃'; line-height:1.2; }

  .optlist { font-size:12px; line-height:1.6; margin:4px 0; }
  .optcombo { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:5px 0; border-bottom:1px solid #1c1a17; }
  .optcombo .optval { margin-left:auto; display:flex; gap:6px; align-items:baseline; } .optcombo button { cursor:pointer; padding:2px 10px; }
  .optgems { display:flex; flex-wrap:wrap; gap:4px 10px; }
  .optgem { display:flex; align-items:center; gap:4px; } .optgem img { width:28px; height:28px; object-fit:contain; } .optgem b { font:13px Georgia, serif; }
  .gitems { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:8px; margin:8px 0; }
  .gitem { background:#000; border:1px solid #444; font-family:Georgia, serif; display:flex; flex-direction:column; }
  .ghead { padding:4px 6px; text-align:center; border-bottom:1px solid; color:#c8c8c8; background:#222; display:flex; flex-direction:column; }
  .ghead small { color:#888; font-size:11px; }
  .gitem.magic .ghead { color:#8888ff; background:#1a1a33; } .gitem.rare .ghead { color:#ffff77; background:#332e10; } .gitem.unique .ghead { color:#af6025; background:#2b1a0d; }
  .gmods { padding:5px 6px; text-align:center; font-size:12px; flex:1; }
  .gfoot { display:flex; flex-direction:column; gap:5px; align-items:center; text-align:center; padding:6px; border-top:1px solid #2a2a2a; font-size:13px; }
  .gfoot .gval b { font-size:15px; } .gprice { color:#ddd; font-size:14px; display:flex; align-items:center; gap:5px; } .gprice img { width:26px; height:26px; object-fit:contain; }
  .gbtns { display:flex; gap:8px; justify-content:center; } .gbtns button { cursor:pointer; padding:3px 12px; }
  .impv { padding:0 6px 5px; font-size:12px; text-align:center; }
  .gfoot a.gsite { background:#222; color:var(--txt); border:1px solid var(--line); padding:3px 12px; text-decoration:none; }
  /* the equipment comparison (Settings) */
  .llive { font-size:12px; }
  #stats { white-space:pre; font-family:monospace; font-size:11px; color:#aaa; }
</style>
</head>
<body>
<header id="top">
  <select id="buildList" title="Saved builds" data-t></select>
  <button id="newBuild" data-t>New build</button>
  <button id="delBuild" data-t>Delete</button>
  <button id="undo" title="Undo (Ctrl+Z)" data-t disabled>↶</button>
  <button id="redo" title="Redo (Ctrl+Y)" data-t disabled>↷</button>

  <span class="grow"></span>
  <button id="notesBtn">Notes</button>
  <button id="importBtn" data-t>Import</button>
  <button id="exportBtn" data-t>Export</button>
  <input id="importFile" type="file" accept=".json" hidden>
  <div id="notesBox" hidden><textarea id="notes" rows="8" placeholder="Build notes…" data-t></textarea></div>
</header>
<div id="body">
<aside id="side">
  <div id="charPanel"></div>
  <div id="skillPanel" class="skdetail" hidden></div>
  <div id="simChar" hidden></div>
  <div id="sceneSkills" hidden><div id="sceneList"></div></div>
</aside>
<main>
  <nav><button data-v="tree" class="on" data-t>Tree</button><button data-v="items" data-t>Equipment</button><button data-v="skills" data-t>Skills</button><button data-v="opt" data-t>Optimizer</button><button data-v="filter" data-t>Loot filter</button><button data-v="scene" data-t>Simulator</button><button data-v="settings" data-t>Settings</button></nav>
  <div class="view" id="tree"><canvas id="treeCanvas"></canvas><div id="treePts"></div><div id="treeSearch"><input id="treeFind" type="search" placeholder="Search nodes…" autocomplete="off" data-t><span id="treeFindN"></span></div><div id="tip" hidden></div></div>
  <div class="view" id="items" hidden></div>
  <div class="view" id="skills" hidden></div>
  <div class="view" id="opt" hidden></div>
  <div class="view" id="scene" hidden><div id="hud"></div></div>
  <div class="view" id="filter" hidden></div>
  <div class="view" id="settings" hidden></div>
</main>
</div>
<div id="gtip" class="gtip" hidden></div>

{ "imports": {

<script type="module" src="app.js"></script>
