# Exilewright takes no outside pull requests: bugs and ideas go to the issues
name: Close outside pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh pr close "$PR" --repo "$REPO" --comment "Thanks! This project does not take pull requests. Please open an issue instead: https://github.com/$REPO/issues/new/choose"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
